name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/keen-wozniak-ot6lgh]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Supabase settings come from .env.production.
      - name: Build
        run: npm run build
      - name: Check family server
        # Calls each server function with a family code that does not exist:
        # "family_not_found" means the function is installed, anything else
        # usually means the latest supabase/schema.sql has not been run yet.
        continue-on-error: true
        run: |
          set -a; . ./.env.production; set +a
          missing=""
          check() {
            response=$(curl -sS -X POST "$VITE_SUPABASE_URL/rest/v1/rpc/$1" \
              -H "apikey: $VITE_SUPABASE_KEY" -H "Content-Type: application/json" -d "$2" 2>&1 || true)
            if echo "$response" | grep -q family_not_found; then
              echo "ok      $1"
            else
              echo "FEHLT   $1: $response"
              missing="$missing $1"
            fi
          }
          code='"p_code":"CHECK000"'
          uuid='"00000000-0000-0000-0000-000000000000"'
          check join_family "{$code}"
          check list_players "{$code}"
          check leaderboard "{$code}"
          check get_family_content "{$code}"
          check list_duels "{$code}"
          check delete_player "{$code,\"p_pin_hash\":\"x\",\"p_player_id\":$uuid}"
          if [ -n "$missing" ]; then
            echo "::warning::Familien-Server: es fehlen$missing – bitte supabase/schema.sql erneut ausführen."
            exit 1
          fi
          echo "Familien-Server ist vollständig eingerichtet."
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
