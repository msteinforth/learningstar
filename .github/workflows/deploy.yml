name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/keen-wozniak-ot6lgh]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Supabase settings come from .env.production.
      - name: Build
        run: npm run build
      - name: Check family server
        # Asks for a family code that does not exist: "family_not_found" means
        # the server is reachable and the current supabase/schema.sql is installed.
        continue-on-error: true
        run: |
          set -a; . ./.env.production; set +a
          # list_duels is the newest function: this also tells whether the latest schema.sql ran.
          response=$(curl -sS -X POST "$VITE_SUPABASE_URL/rest/v1/rpc/list_duels" \
            -H "apikey: $VITE_SUPABASE_KEY" -H "Content-Type: application/json" \
            -d '{"p_code":"CHECK000"}')
          echo "$response"
          if echo "$response" | grep -q family_not_found; then
            echo "Familien-Server ist eingerichtet."
          else
            echo "::warning::Familien-Server antwortet unerwartet – ist supabase/schema.sql ausgeführt?"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
